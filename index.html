    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #000;
        color: white;
        overflow: hidden;
      }
      .hex-btn {
        clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
      }
      .bg-gradient-vtv {
        background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 70%, #000000 100%);
      }
      @keyframes blink {
        0%, 100% { background-color: #fbbf24; color: black; }
        50% { background-color: #d97706; color: white; }
      }
      .animate-blink {
        animation: blink 0.5s infinite;
      }
      @keyframes blink-correct {
        0%, 100% { background-color: #22c55e; }
        50% { background-color: #15803d; }
      }
      .animate-correct {
        animation: blink-correct 0.3s infinite;
      }
    </style>
